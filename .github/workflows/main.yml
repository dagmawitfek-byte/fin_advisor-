name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: false

      - name: Remove old lock file
        working-directory: fin_advisor-main
        run: rm -f pubspec.lock

      - name: Clear pub cache
        working-directory: fin_advisor-main
        run: flutter pub cache clean

      - name: Get dependencies
        working-directory: fin_advisor-main
        run: flutter pub get

      - name: Clean build
        working-directory: fin_advisor-main
        run: flutter clean

      - name: Build APK
        working-directory: fin_advisor-main
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fin-advisor-apk
          path: fin_advisor-main/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
